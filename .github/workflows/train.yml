name: Quoridor engine experiments v2
on:
  workflow_dispatch:
  schedule:
    - cron: '17 3 * * *'
permissions:
  contents: read
concurrency:
  group: quoridor-training
  cancel-in-progress: false
jobs:
  tournament:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check engine rules
        run: node training/check.cjs
      - name: Restore previous champion
        uses: actions/cache/restore@v4
        with:
          path: training-state
          key: quoridor-v2-champion-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            quoridor-v2-champion-
      - name: Play paired games and update champion
        run: node training/run.cjs --pairs=20 --gate=4 --nodes=1200 --seed=${{ github.run_number }}
      - name: Save checkpoint for next run
        uses: actions/cache/save@v4
        with:
          path: training-state
          key: quoridor-v2-champion-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Publish game records and offline app
        uses: actions/upload-artifact@v4
        with:
          name: quoridor-v2-results-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            results/
            training-state/champion.json
          retention-days: 30
