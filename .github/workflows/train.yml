name: Quoridor five-hour experiments
on:
  workflow_dispatch:
  schedule:
    - cron: '13 */6 * * *'
permissions:
  contents: write
concurrency:
  group: quoridor-training
  cancel-in-progress: false
jobs:
  tournament:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Restore prior v2 checkpoint when needed
        if: ${{ hashFiles('training-state/champion.json') == '' }}
        uses: actions/cache/restore@v4
        with:
          path: training-state
          key: quoridor-v2-import-${{ github.run_id }}
          restore-keys: |
            quoridor-v2-champion-
      - name: Check game rules
        run: node training/check.cjs
      - name: Run five-hour tournament
        run: node training/marathon.cjs --seconds=17700 --workers=4 --pairs=20 --gate=4 --nodes=1200 --seed=${{ github.run_number }}
      - name: Preserve results and latest engine
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: quoridor-five-hour-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            results/
            trained/Quoridor_Lab_trained.html
            training-state/champion.json
          if-no-files-found: warn
          retention-days: 30
      - name: Commit champion for the next run
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          test -f training-state/champion.json
          test -f trained/Quoridor_Lab_trained.html
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch origin "$DEFAULT_BRANCH"
          if [ "$(git rev-parse HEAD)" != "$(git rev-parse FETCH_HEAD)" ]; then
            echo 'The default branch changed during training. Results are in the artifact; refusing to overwrite newer work.'
            exit 1
          fi
          git add -f training-state/champion.json trained/Quoridor_Lab_trained.html
          if git diff --cached --quiet; then
            echo 'No checkpoint changes to commit.'
            exit 0
          fi
          git commit -m 'Update Quoridor training champion'
          git push origin "HEAD:refs/heads/$DEFAULT_BRANCH"
